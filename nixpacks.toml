[phases.setup]
nixPkgs = [
    "python311",
    "python311Packages.pip",
    "chromium",
    "glib",
    "nss",
    "nspr",
    "atk",
    "at-spi2-atk",
    "cups",
    "dbus",
    "gtk3",
    "pango",
    "cairo",
    "mesa",
    "alsa-lib",
    "xorg.libX11",
    "xorg.libXcomposite",
    "xorg.libXdamage",
    "xorg.libXext",
    "xorg.libXfixes",
    "xorg.libXrandr",
    "xorg.libxcb"
]

[phases.install]
cmds = [
    "pip install -r requirements.txt",
    "playwright install chromium"
]

[phases.start]
cmds = ["python3.11 bot.py"]
